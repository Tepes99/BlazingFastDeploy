[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ship-cli"
version = "0.1.0"
description = "A small, personal application publisher for one Docker host"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Teemu Saha"}]
dependencies = []

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.3", "ruff>=0.11"]

[project.scripts]
ship = "ship.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ship"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ship"]
mypy_path = "src"
